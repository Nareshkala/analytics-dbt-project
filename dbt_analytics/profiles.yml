dbt_analytics:
  target: dev
  outputs:

    dev:
      type: snowflake
      account: ""
      user: ""
      role: "{{ env_var('DBT_DEV_ROLE') }}"              # Resolved from env.yml
      database: "{{ env_var('DBT_DEV_DATABASE') }}"
      warehouse: "{{ env_var('DBT_DEV_WH') }}"
      schema: "{{ env_var('DBT_DEV_SCHEMA') }}"
      threads: 8
      client_session_keep_alive: False
      query_tag: "dbt_dev"

    prod:
      type: snowflake
      account: ""
      user: ""
      role: "{{ env_var('DBT_PROD_ROLE') }}"
      database: "{{ env_var('DBT_PROD_DATABASE') }}"
      warehouse: "{{ env_var('DBT_PROD_WH') }}"
      schema: "{{ env_var('DBT_PROD_SCHEMA') }}"
      threads: 8
      client_session_keep_alive: False
      query_tag: "dbt_prod"

# For CI/CD (GitHub Actions), use a separate profile
# that reads environment variables set in GitHub Secrets

cicd:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:

    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_DEV_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DEV_DATABASE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_DEV_WAREHOUSE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      threads: 4
      client_session_keep_alive: False
      query_tag: "dbt_cicd_dev"

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_PROD_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_PROD_DATABASE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_PROD_WAREHOUSE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      threads: 4
      client_session_keep_alive: False
      query_tag: "dbt_cicd_prod"
