env_config:
  default_environment: dev

  environments:
    - name: dev
      env:
        # Current session context (dynamic)
        DBT_CURRENT_ROLE: "{{ select CURRENT_ROLE() }}"
        DBT_CURRENT_WH: "{{ select CURRENT_WAREHOUSE() }}"
        DBT_CURRENT_USER: "{{ select CURRENT_USER() }}"

        # Dev environment settings (update these for your account)
        DBT_DEV_DATABASE: "ANALYTICS_DEV"
        DBT_DEV_SCHEMA: "DBT_MODELS"
        DBT_DEV_ROLE: "DBT_DEV_ROLE"     
        DBT_DEV_WH: "DBT_DEV_WH"
        

    - name: prod
      env:
        # Prod uses explicit role/warehouse
        DBT_CURRENT_ROLE: "DBT_PROD_ROLE"
        DBT_CURRENT_WH: "DBT_PROD_WH"
        DBT_CURRENT_USER: "{{ select CURRENT_USER() }}"

        # Prod environment settings
      
        DBT_PROD_ROLE: "DBT_PROD_ROLE"
        DBT_PROD_DATABASE: "ANALYTICS_PROD"
        DBT_PROD_WH: "DBT_PROD_WH"
        DBT_PROD_SCHEMA: "DBT_MODELS"
