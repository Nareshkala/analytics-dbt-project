
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_analytics'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_analytics'

# Required by dbt-snowflake >= ~1.8 to opt into Iceberg table materialization
# (gated behind a behavior flag rather than on by default). Without this,
# any model with `table_format: iceberg` fails to build on adapter versions
# that enforce the flag — even though older adapter versions (e.g. what may
# be installed locally) don't require it at all, which is why a model can
# build fine from a local machine but fail in CI if the two environments are
# pinned to different dbt-snowflake versions.
flags:
  enable_iceberg_materializations: true

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

vars:
  # Name of the Snowflake EXTERNAL VOLUME that stores Iceberg table data/metadata.
  # Override per-target in profiles.yml or with --vars if dev/prod use different volumes.
  # Not needed if a default external volume is already set at the account/db/schema level.
  iceberg_external_volume: 'iceberg_external_volume'

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
# Fixed calendar range for gold.dim_date. Widen/narrow with --vars if needed,
# but this comfortably covers the flight data (~2013 onward) with headroom.
  dim_date_start_date: "2010-01-01"
  dim_date_end_date: "2035-12-31"
# =====================================================
# FLIGHT DATA - Medallion Architecture
# =====================================================
models:
  dbt_analytics:
    # Config indicated by + and applies to all files under models/example/
    example:
      +materialized: view

    flight_data:

      # Bronze layer - Raw data ingestion from S3
      bronze:
        +materialized: incremental
        +incremental_strategy: "append"
        +on_schema_change: "append_new_columns"
        +schema: bronze
        +tags: ["bronze"]
        +table_format: "iceberg"
        +unique_key: "_bronze_row_id"
        +external_volume: "{{ var('iceberg_external_volume', 'iceberg_external_volume') }}"

      # Silver layer - Cleaned and transformed data
      silver:
        +materialized: incremental
        +incremental_strategy: "merge"
        +on_schema_change: "append_new_columns"
        +schema: silver
        +tags: ["silver"]
        +table_format: "iceberg"
        +external_volume: "{{ var('iceberg_external_volume', 'iceberg_external_volume') }}"
      

      # Gold layer - Analytics-ready data
      gold:
        +materialized: table
        +schema: gold
        +tags: ["gold"]
        +table_format: "iceberg"
        +external_volume: "{{ var('iceberg_external_volume', 'iceberg_external_volume') }}"
  