name: dbt CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - prod
    types: [closed]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

# IMPORTANT: dbt project is in dbt_analytics/ subdirectory
env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_analytics
  DBT_PROJECT_DIR: ${{ github.workspace }}/dbt_analytics
  # Pin the same dbt-snowflake version everywhere in this file (and match it
  # locally when regenerating package-lock.yml) so lock-file schema and CLI
  # behavior stay consistent between dev machines and CI.
  DBT_SNOWFLAKE_VERSION: '1.9.4'

jobs:
  dbt-test:
    name: dbt Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt-snowflake
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake==${{ env.DBT_SNOWFLAKE_VERSION }}

      - name: Verify dbt installation
        run: dbt --version

      - name: Configure dbt profile for CI/CD
        working-directory: dbt_analytics
        # Reuses dev credentials — safe because `dbt compile` never opens a
        # connection to actually run anything, it only renders SQL. No
        # separate CI database/role needed for this. Real build+test happens
        # locally before you push, and again for real in deploy-dev/deploy-prod.
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_DEV_ROLE: ${{ secrets.SNOWFLAKE_DEV_ROLE }}
          SNOWFLAKE_DEV_DATABASE: ${{ secrets.SNOWFLAKE_DEV_DATABASE }}
          SNOWFLAKE_DEV_WAREHOUSE: ${{ secrets.SNOWFLAKE_DEV_WAREHOUSE }}
        run: |
          cat > profiles.yml <<EOF
          dbt_analytics:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: $SNOWFLAKE_ACCOUNT
                user: $SNOWFLAKE_USER
                password: $SNOWFLAKE_PASSWORD
                role: $SNOWFLAKE_DEV_ROLE
                database: $SNOWFLAKE_DEV_DATABASE
                warehouse: $SNOWFLAKE_DEV_WAREHOUSE
                schema: dbt_ci
                threads: 4
                client_session_keep_alive: False
                query_tag: dbt_cicd_compile
          EOF

      - name: Install dbt dependencies
        working-directory: dbt_analytics
        run: dbt deps

      - name: Run dbt debug
        working-directory: dbt_analytics
        run: dbt debug

      - name: Compile dbt models
        working-directory: dbt_analytics
        # Compile-only: catches Jinja/ref/YAML/macro errors before deploy runs,
        # with zero writes to Snowflake. Won't catch real SQL errors (type
        # mismatches, merge conflicts) — those only surface when code actually
        # runs, which happens locally (before you push) and for real in
        # deploy-dev/deploy-prod.
        run: dbt compile

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: dbt-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: development
      url: https://app.snowflake.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt-snowflake
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake==${{ env.DBT_SNOWFLAKE_VERSION }}

      - name: Configure dbt profile for Dev
        working-directory: dbt_analytics
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_DEV_ROLE: ${{ secrets.SNOWFLAKE_DEV_ROLE }}
          SNOWFLAKE_DEV_DATABASE: ${{ secrets.SNOWFLAKE_DEV_DATABASE }}
          SNOWFLAKE_DEV_WAREHOUSE: ${{ secrets.SNOWFLAKE_DEV_WAREHOUSE }}
          SNOWFLAKE_SCHEMA: dbt_models
        run: |
          cat > profiles.yml <<EOF
          dbt_analytics:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: $SNOWFLAKE_ACCOUNT
                user: $SNOWFLAKE_USER
                password: $SNOWFLAKE_PASSWORD
                role: $SNOWFLAKE_DEV_ROLE
                database: $SNOWFLAKE_DEV_DATABASE
                warehouse: $SNOWFLAKE_DEV_WAREHOUSE
                schema: $SNOWFLAKE_SCHEMA
                threads: 4
                client_session_keep_alive: False
                query_tag: dbt_cicd_dev
          EOF

      - name: Install dbt dependencies
        working-directory: dbt_analytics
        run: dbt deps

      - name: Run dbt seed
        working-directory: dbt_analytics
        run: dbt seed

      - name: Run dbt run
        working-directory: dbt_analytics
        run: dbt run

      - name: Run dbt test
        working-directory: dbt_analytics
        run: dbt test

      - name: Generate dbt docs
        working-directory: dbt_analytics
        run: dbt docs generate

      - name: Deployment summary
        run: |
          echo "✅ Deployment to DEVELOPMENT completed successfully!"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: dbt-test
    # NOTE: `on.push.branches` above only listens for `main`, so a push to
    # `prod` can never actually trigger this workflow — that condition was
    # dead code. Production deploys happen via a PR merged into `prod`
    # (matches the `pull_request: types: [closed]` trigger above) or manual
    # `workflow_dispatch`. If you also want direct pushes to `prod` to
    # deploy, add `prod` to `on.push.branches` and restore the ref check.
    if: |
      (github.event.pull_request.merged == true && github.base_ref == 'prod') ||
      (github.event.inputs.environment == 'prod')

    environment:
      name: production
      url: https://app.snowflake.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt-snowflake
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake==${{ env.DBT_SNOWFLAKE_VERSION }}

      - name: Configure dbt profile for Prod
        working-directory: dbt_analytics
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_PROD_ROLE: ${{ secrets.SNOWFLAKE_PROD_ROLE }}
          SNOWFLAKE_PROD_DATABASE: ${{ secrets.SNOWFLAKE_PROD_DATABASE }}
          SNOWFLAKE_PROD_WAREHOUSE: ${{ secrets.SNOWFLAKE_PROD_WAREHOUSE }}
          SNOWFLAKE_SCHEMA: dbt_models
        run: |
          cat > profiles.yml <<EOF
          dbt_analytics:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: $SNOWFLAKE_ACCOUNT
                user: $SNOWFLAKE_USER
                password: $SNOWFLAKE_PASSWORD
                role: $SNOWFLAKE_PROD_ROLE
                database: $SNOWFLAKE_PROD_DATABASE
                warehouse: $SNOWFLAKE_PROD_WAREHOUSE
                schema: $SNOWFLAKE_SCHEMA
                threads: 4
                client_session_keep_alive: False
                query_tag: dbt_cicd_prod
          EOF

      - name: Install dbt dependencies
        working-directory: dbt_analytics
        run: dbt deps

      - name: Run dbt seed
        working-directory: dbt_analytics
        run: dbt seed

      - name: Run dbt run (full refresh for prod)
        working-directory: dbt_analytics
        run: dbt run --full-refresh

      - name: Run dbt test
        working-directory: dbt_analytics
        run: dbt test

      - name: Generate dbt docs
        working-directory: dbt_analytics
        run: dbt docs generate

      - name: Deployment summary
        run: |
          echo "🚀 Deployment to PRODUCTION completed successfully!"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "⚠️ Production database has been updated"